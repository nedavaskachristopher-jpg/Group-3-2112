name: Verify frozen research and group integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m tools.check_repository
      - run: python review.py verify
      - run: python -m tools.check_integration
      - run: python review.py test
      - run: python review.py results
      - name: Confirm checks did not rewrite tracked artifacts
        run: git diff --exit-code
